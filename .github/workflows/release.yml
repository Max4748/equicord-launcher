name: release

# Compile le launcher sur Windows et Ubuntu, puis publie les installeurs
# (.exe Inno Setup + .deb) dans une Release GitHub.
# Déclenché par un tag vX.Y.Z, ou manuellement (Actions > release > Run workflow).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release (ex. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Installer Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Compiler l'installeur
        run: powershell -ExecutionPolicy Bypass -File installer/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: installer/windows/output/equicord-launcher-setup.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compiler le .deb
        run: |
          chmod +x installer/linux/build-deb.sh
          ./installer/linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: target/*.deb
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/**
          generate_release_notes: true
