[package]
name = "equicord-launcher"
version = "0.2.3"
edition = "2021"
description = "Launcher natif qui réinjecte Equicord dans Discord à chaque lancement, sans patcher les fichiers de Discord."
license = "GPL-3.0"
# = rustc de nightly-2025-03-01 (rust-toolchain.toml). Permet à cargo de choisir des
# dépendances compatibles (resolver MSRV-aware).
rust-version = "1.87"
autobins = false

[lib]
name = "equicord_launcher"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "equicord-stable"
path = "src/bin/stable.rs"

[[bin]]
name = "equicord-ptb"
path = "src/bin/ptb.rs"

[[bin]]
name = "equicord-canary"
path = "src/bin/canary.rs"

[dependencies]
# Épinglé sur 0.2.1 : version utilisée par Vencord-Launcher, qui ship des binaires
# Windows. Son code Windows (hooks Detours de CreateFileW/CreateProcessW) est complet ;
# le "TODO: Re-implement Windows support" ne concerne que la 0.2.2.
electron-hook = "=0.2.1"
clap = { version = "4.5.27", features = ["derive"] }
dirs = "6.0.0"
serde = { version = "1.0.217", features = ["derive"] }
toml = "0.8.19"
# Téléchargement de la build officielle d'Equicord (TLS rustls par défaut).
ureq = { version = "3", features = ["json"] }

# Copie locale de 0.2.1 corrigée (src/linux/hooks.rs) : sans cela, tout programme lié à
# la libuv partagée et lancé depuis Discord segfaulte au premier lstat.
[patch.crates-io]
electron-hook = { path = "vendor/electron-hook" }

# electron-hook 0.2.1 utilise des modules winapi sans déclarer leurs features.
# On les active ici : le resolver de cargo unifie les features winapi avec celles
# d'electron-hook, ce qui corrige sa compilation sous Windows.
[target.'cfg(windows)'.dependencies.winapi]
version = "0.3.9"
features = [
    "handleapi",
    "winuser",
    "processthreadsapi",
    "winbase",
    "fileapi",
    "libloaderapi",
    "minwinbase",
    "minwindef",
    "winnt",
    # AttachConsole : les binaires n'ont pas de console propre (windows_subsystem).
    "wincon",
    # WaitForSingleObject : attente de l'ancien Discord lors d'un relaunch.
    "synchapi",
]
