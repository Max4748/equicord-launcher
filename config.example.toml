# Exemple de configuration. Copie-le vers :
#   Windows : %APPDATA%\equicord-launcher\config.toml
#   Linux   : ~/.config/equicord-launcher/config.toml
# (ou passe --config <chemin>). Les arguments CLI sont prioritaires sur ce fichier.

# Build local d'Equicord (optionnel). Sans cette ligne, la build officielle est
# téléchargée au lancement et mise à jour automatiquement.
# Accepte la racine du repo, dist/, dist/desktop/ ou .../dist/desktop/patcher.js.
# equicord_dist = "C:\\chemin\\vers\\Equicord\\dist\\desktop"

# Branche par défaut (sinon, chaque binaire impose la sienne).
# branch = "stable"   # stable | ptb | canary

# Arguments passés tels quels à Discord.
# extra_args = ["--start-minimized"]
